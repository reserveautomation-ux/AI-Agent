[project]
name = "workforce-core"
version = "0.1.0"
description = "Shared domain logic: task state machine, policy engine, approvals, DB helpers"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce_core"]
