# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Render asks for every value marked `sync: false` (secrets are never stored in git).
# The database and sign-in are your Supabase project (see docs/DEPLOY.md).
services:
  # Workforce API (tasks, workforce, memory, files, push devices)
  - type: web
    name: workforce-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Supabase session pooler connection string
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: CORS_ORIGINS # JSON list with your web app URL, e.g. ["https://workforce-web.onrender.com"]
        sync: false
      - key: ANTHROPIC_API_KEY # chat assistant replies (same key as the worker)
        sync: false
      - key: PUBLIC_API_URL # this API's https address (Telegram chat sends messages here)
        sync: false
      # Gmail + Google Calendar (optional until you connect them; see docs/DEPLOY.md step 5)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI # https://<your-api>/connections/google/callback
        sync: false
      - key: TOKEN_ENCRYPTION_KEY # same value on the worker
        sync: false
      # Sign-in for other services (Slack); see docs/DEPLOY.md step 6
      - key: OAUTH_REDIRECT_URI # https://<your-api>/connections/oauth/callback
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false

  # Agent worker: Chief planner, specialists, QA verifier, browser, push alerts
  - type: worker
    name: workforce-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: standard # the agent browser (Chromium) needs ~1-2 GB RAM
    region: singapore
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY # from console.anthropic.com
        sync: false
      - key: GOOGLE_CLIENT_ID # same as the API
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY # same value as the API
        sync: false
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: BROWSER_ENABLED
        value: "true"

  # Web app (Next.js)
  - type: web
    name: workforce-web
    runtime: node
    rootDir: apps/web
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL # e.g. https://workforce-api.onrender.com
        sync: false
