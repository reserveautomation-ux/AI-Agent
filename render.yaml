# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Render asks for every value marked `sync: false` (secrets are never stored in git).
# The database and sign-in are your Supabase project (see docs/DEPLOY.md).
#
# Done for you: the database sets itself up on first start (AUTO_MIGRATE), the encryption
# key for connected accounts is generated by Render and shared below, and the API works
# out its own public address and sign-in callback URLs.

envVarGroups:
  - name: workforce-shared
    envVars:
      - key: TOKEN_ENCRYPTION_KEY # protects connected accounts' tokens; generated once
        generateValue: true

services:
  # Workforce API (chat, tasks, workforce, memory, files, connections)
  - type: web
    name: workforce-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: workforce-shared
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_URL # Supabase: Connect -> Session pooler connection string
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: ANTHROPIC_API_KEY # console.anthropic.com -> API keys
        sync: false
      - key: CORS_ORIGINS # ["https://<your web app>.onrender.com"]; set after the first deploy
        sync: false
      # Optional, add later: Google (Gmail, Calendar, Drive) and Slack sign-in.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false

  # Agent worker: Chief planner, specialists, QA verifier, browser, alerts, reminders
  - type: worker
    name: workforce-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: 1c-2g # the agent browser (Chromium) needs ~1-2 GB RAM
    region: singapore
    autoDeploy: true
    envVars:
      - fromGroup: workforce-shared
      - key: DATABASE_URL # same as the API
        sync: false
      - key: ANTHROPIC_API_KEY # same as the API
        sync: false
      - key: GOOGLE_CLIENT_ID # optional, same as the API
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: BROWSER_ENABLED
        value: "true"

  # Web app (Next.js)
  - type: web
    name: workforce-web
    runtime: node
    rootDir: apps/web
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL # same as SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY # Supabase: Project Settings -> API keys
        sync: false
      - key: NEXT_PUBLIC_API_URL # https://<your API>.onrender.com; set after the first deploy
        sync: false
