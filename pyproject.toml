[project]
name = "workforce-os"
version = "0.1.0"
description = "Autonomous AI Workforce OS - backend workspace root"
requires-python = ">=3.12"
dependencies = ["workforce-core", "workforce-api", "workforce-worker"]

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
workforce-core = { workspace = true }
workforce-api = { workspace = true }
workforce-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests", "apps/worker/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
