[project]
name = "workforce-worker"
version = "0.1.0"
description = "Background agent workers: task execution, browser, tool gateway"
requires-python = ">=3.12"
dependencies = [
    "workforce-core",
    "playwright>=1.55",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce_worker"]
